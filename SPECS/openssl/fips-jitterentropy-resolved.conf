# Installed by openssl-fips-provider, so only on FIPS systems.
#
# The FIPS configuration (/etc/ssl/provider_fips.cnf) seeds OpenSSL's DRBG
# from the jitterentropy provider, which reads the kernel's FIPS
# jitterentropy_rng through an AF_ALG socket. systemd-resolved initialises
# OpenSSL under RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6,
# so the provider cannot open that socket: it logs
#   JENTROPY-ERROR: algif_rng_open():135
#   ERROR: socket(...) failed ...('Address family not supported by protocol')
# at every start and OpenSSL seeds from getrandom() instead of the configured
# source. Allow AF_ALG as well; the other restrictions stay.
[Service]
RestrictAddressFamilies=AF_ALG
